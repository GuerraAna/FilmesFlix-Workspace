name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bff:
    name: BFF (services/filmes-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/filmes-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - name: Upload coverage report (BFF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-jacoco-report
          path: services/filmes-api/build/reports/jacoco/
          retention-days: 14

  app:
    name: App (apps/filmes-flix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/filmes-flix
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule GuerraAna/FilmesFlix is public — default GITHUB_TOKEN
          # can clone it. If it ever goes private again, this job needs
          # token: ${{ secrets.APP_SUBMODULE_TOKEN }} (see AGENTS.md).
          submodules: true
      # Note: the legacy 'tools' package no longer exists in the sdkmanager repo.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest jacocoTestReport jacocoTestCoverageVerification
      - name: Upload coverage report (app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-jacoco-report
          path: apps/filmes-flix/app/build/reports/jacoco/
          retention-days: 14

  contract:
    name: Contrato (contracts/openapi.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @redocly/cli@1 lint contracts/openapi.yaml
